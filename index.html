<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Say It Again - Dark Horizon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="song-header">
            <!-- Se quiser colocar a capa da música, ela fica aqui -->
            <div class="album-art">
                <img src="capa.jpg" alt="Capa Dark Horizon">
            </div>
            <h1>Say It Again</h1>
            <h2>Dark Horizon</h2>
        </header>

        <main class="lyrics-container">
            <!-- Coluna da Letra Original -->
            <section class="lyrics-column">
                <h3>Letra Original</h3>
                <div id="original-text"></div>
            </section>

            <!-- Coluna da Tradução -->
            <section class="lyrics-column">
                <h3>Tradução</h3>
                <div id="translated-text"></div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
