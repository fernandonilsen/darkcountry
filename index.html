<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player com Letra e Tradução</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Say It Again</h1>
            <h2>Dark Horizon</h2>
        </header>

        <!-- Player de Áudio -->
        <div class="player-container">
            <audio id="audio" src="sua-musica.mp3"></audio>
            <div class="controls">
                <button id="play-btn">▶ Play</button>
                <input type="range" id="progress" value="0" max="100" step="1">
                <span id="time">0:00</span>
            </div>
        </div>

        <!-- Seção de Letras e Traduções -->
        <div class="lyrics-section">
            <div class="lyric-box">
                <h3>Letra Original</h3>
                <div class="text-content">
                    <p>Line 1 of the original song...</p>
                    <p>Line 2 of the original song...</p>
                    <!-- Adicione mais versos aqui -->
                </div>
            </div>

            <div class="lyric-box">
                <h3>Tradução</h3>
                <div class="text-content">
                    <p>Linha 1 da música traduzida...</p>
                    <p>Linha 2 da música traduzida...</p>
                    <!-- Adicione mais versos aqui -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
