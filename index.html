<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Country Vault</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Ícones Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Esquerda (Playlist e Contador) -->
        <aside class="sidebar" id="tab-playlist">
            <div class="sidebar-header">
                <div class="logo">
                    <i data-lucide="skull"></i>
                    <h2>Dark Country Vault</h2>
                </div>
                <button class="close-btn" id="close-sidebar"><i data-lucide="x"></i></button>
            </div>
            
            <ul id="playlist-list" class="playlist">
                <!-- Músicas inseridas via JS -->
            </ul>

            <!-- Caixa de Visitantes (Exatamente como na imagem) -->
            <div class="visitor-box">
                <span class="visitor-title">Visitor Counter</span>
                <span id="visit-count" class="visitor-count">4,321 Views</span>
            </div>
        </aside>

        <!-- Área Principal -->
        <main class="main-content">
            <!-- Card Superior da Música Atual (Capa emoldurada + Títulos) -->
            <div class="now-playing-card">
                <div class="card-header-top">
                    <span id="card-top-title">WHISKEY AND DUST</span>
                    <span id="card-top-artist">- THE DUSTY OUTLAWS -</span>
                </div>
                <div class="card-body-content">
                    <img id="track-cover" src="audio/capa1.jpg" alt="Capa da música">
                    <div class="track-details">
                        <h1 id="track-title">Whiskey and Dust</h1>
                        <p id="track-artist">The Dusty Outlaws</p>
                        <p id="track-album-sub">Whiskey and Dust</p>
                    </div>
                </div>
            </div>

            <!-- Seção de Letras (Pergaminhos Duplos) -->
            <section class="lyrics-container">
                <div class="lyrics-box">
                    <h3>Original Lyrics</h3>
                    <div id="lyrics-original" class="lyrics-text">
                        <p class="placeholder">Selecione uma faixa...</p>
                    </div>
                </div>
                <div class="lyrics-box">
                    <h3>Tradução (PT-BR)</h3>
                    <div id="lyrics-translation" class="lyrics-text">
                        <p class="placeholder">A tradução aparecerá aqui...</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- Player Fixo no Rodapé -->
        <footer class="player-bar">
            <audio id="audio-player"></audio>
            
            <div class="player-controls">
                <button id="btn-prev" class="control-btn"><i data-lucide="skip-back"></i></button>
                <button id="btn-play" class="control-btn play-btn"><i data-lucide="play"></i></button>
                <button id="btn-next" class="control-btn"><i data-lucide="skip-forward"></i></button>
            </div>

            <div class="timeline-container">
                <span id="current-time">1:15</span>
                <input type="range" id="seek-bar" value="33" max="100">
                <span id="duration">3:45</span>
            </div>

            <div class="volume-container">
                <i data-lucide="volume-2"></i>
                <input type="range" id="volume-bar" value="80" max="100">
            </div>
        </footer>

        <!-- Botão Flutuante para Celular -->
        <button class="floating-playlist-btn" id="open-sidebar">
            <i data-lucide="disc"></i>
        </button>
    </div>

    <!-- Scripts JavaScript -->
    <script src="js/playlist.js"></script>
    <script src="js/app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
